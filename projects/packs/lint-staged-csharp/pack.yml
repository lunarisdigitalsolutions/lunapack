id: lint-staged-csharp
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Format staged C# files with dotnet format and CSharpier.
tags: [lint-staged, csharp, formatting]
parameters:
  lintStagedDotnetWorkspace:
    type: string
    required: true
    displayName: .NET workspace path
packs:
  - id: lint-staged
    version: 1.0.0
managedFiles:
  - source: templates/package.json
    target: package.json
    template: true
    strategy:
      type: merge
      method: json
