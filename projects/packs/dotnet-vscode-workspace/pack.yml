id: dotnet-vscode-workspace
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Configure shared VS Code formatters and extensions for .NET repositories.
tags: [dotnet, vscode, editor]
parameters:
  dotnetSolutionPath:
    type: string
    required: true
    displayName: .NET solution path
managedFiles:
  - source: templates/.vscode/settings.json
    target: .vscode/settings.json
    template: true
    strategy:
      type: merge
      method: json
  - source: templates/.vscode/extensions.json
    target: .vscode/extensions.json
    strategy:
      type: merge
      method: json
