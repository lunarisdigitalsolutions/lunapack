id: github-community-health
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Add parameterized conduct, security, and support policies.
tags: [github, community, governance]
parameters:
  communityProjectName:
    type: string
    required: true
    displayName: Project name
  communityContact:
    type: string
    required: true
    displayName: Community contact
  communitySecurityUrl:
    type: string
    required: true
    displayName: Private security reporting URL
  communitySupportUrl:
    type: string
    required: true
    displayName: Support URL
managedFiles:
  - source: templates/CODE_OF_CONDUCT.md
    target: CODE_OF_CONDUCT.md
    template: true
  - source: templates/SECURITY.md
    target: SECURITY.md
    template: true
  - source: templates/SUPPORT.md
    target: SUPPORT.md
    template: true
