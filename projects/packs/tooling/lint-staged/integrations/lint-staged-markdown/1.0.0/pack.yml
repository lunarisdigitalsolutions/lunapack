id: lint-staged-markdown
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Lint and format staged Markdown files.
tags: [lint-staged, markdown, formatting]
packs:
  - id: lint-staged-markdownlint
    version: 1.0.0
  - id: prettier-config
    version: 1.0.0
managedFiles:
  - source: fragments/package.json/lint-staged-markdown.json
    target: package.json
    strategy:
      type: merge
      method: json
