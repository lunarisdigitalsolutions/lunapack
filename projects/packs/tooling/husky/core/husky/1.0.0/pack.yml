id: husky
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Add Husky as a repository-local Git hook manager.
tags: [git, hooks, node]
parameters:
  prepareCommand:
    type: string
    default: husky
    description: Command run by the package prepare script.
managedFiles:
  - source: fragments/package.json/husky.json
    target: package.json
    template: true
    strategy:
      type: merge
      method: json
hooks:
  postInstall:
    - type: instruction
      file: instructions/install.md
