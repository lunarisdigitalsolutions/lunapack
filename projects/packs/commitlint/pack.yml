id: commitlint
version: 2.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Validate conventional titles with configurable repository scopes.
tags:
  - git
  - pull-request
  - commitlint
parameters:
  commitlintScopes:
    type: enum
    multiple: true
    default: [frontend, backend]
    displayName: Commitlint scopes
    description: Allowed optional scopes for conventional titles.
    values:
      - api
      - backend
      - build
      - cli
      - docs
      - frontend
      - infrastructure
      - packs
      - schema
      - security
      - tests
      - website
managedFiles:
  - source: templates/.commitlintrc.cjs
    target: .commitlintrc.cjs
    template: true
  - source: templates/conventional-commits.md
    target: docs/developer/conventional-commits.md
hooks:
  postInstall:
    - type: script
      command: npm
      arguments:
        - install
        - --save-dev
        - --ignore-scripts
        - '@commitlint/config-conventional@20.4.2'
        - '@commitlint/cli@20.4.2'
      description: Install Commitlint and its conventional-commit rules.
