id: lint-staged-yaml
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Format staged YAML files with Prettier.
tags: [lint-staged, yaml, formatting]
packs:
  - id: lint-staged
    version: 1.0.0
  - id: prettier-standard-config
    version: 1.0.0
managedFiles:
  - source: templates/package.json
    target: package.json
    strategy:
      type: merge
      method: json
