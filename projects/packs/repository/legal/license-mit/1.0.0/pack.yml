id: license-mit

version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Manage a parameterized MIT license with explicit overwrite behavior.
parameters:
  companyName:
    type: string
    default: Your Organization
    displayName: Company name
    description: Legal entity name for the license notice.
managedFiles:
  - source: targets/LICENSE.md
    target: LICENSE.md
    template: true
    strategy:
      type: copy
      method: overwrite
hooks:
  postInstall:
    - type: instruction
      file: instructions/customize.md
