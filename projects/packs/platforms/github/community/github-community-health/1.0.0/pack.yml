id: github-community-health
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Add parameterized conduct, security, and support policies.
tags: [github, community, governance]
parameters:
  projectName:
    type: string
    required: true
    displayName: Project name
  projectEmail:
    type: string
    required: true
    displayName: Project contact
  securityUrl:
    type: string
    required: true
    displayName: Private security reporting URL
    description: Private URL for security researchers to report vulnerabilities.
  supportUrl:
    type: string
    required: true
    displayName: Support URL
    description: Public support URL for users to report issues or request help.
managedFiles:
  - source: targets/CODE_OF_CONDUCT.md
    target: CODE_OF_CONDUCT.md
    template: true
  - source: targets/SECURITY.md
    target: SECURITY.md
    template: true
  - source: targets/SUPPORT.md
    target: SUPPORT.md
    template: true
