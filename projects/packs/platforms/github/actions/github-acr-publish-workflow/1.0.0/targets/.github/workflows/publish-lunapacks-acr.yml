name: Publish LunaPacks to ACR

on:
  push:
    branches:
      - main
    paths:
      - packs/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-acr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install Luna
        shell: bash
        env:
          LUNA_VERSION: ${{ vars.LUNA_VERSION }}
        run: |
          set -euo pipefail
          : "${LUNA_VERSION:?Set the repository variable LUNA_VERSION}"
          npm install --global "@lunarisdigitalsolutions/lunapack@$LUNA_VERSION"
          luna --help

      - name: Authenticate to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish changed packs
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/find_changed_packs_acr.py "$BEFORE" "$AFTER" \
            > "$RUNNER_TEMP/changed-packs.bin"
          while IFS= read -r -d '' pack; do
            luna publish "$pack" --target acr
          done < "$RUNNER_TEMP/changed-packs.bin"
