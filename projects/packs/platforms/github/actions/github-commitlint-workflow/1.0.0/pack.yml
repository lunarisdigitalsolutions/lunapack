id: github-commitlint-workflow
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Validate conventional pull request titles with GitHub Actions.
tags:
  - github-actions
  - pull-request
  - commitlint
packs:
  - id: commitlint
    version: 1.0.0
managedFiles:
  - source: targets/.github/workflows/pull-request-validation.yml
    target: .github/workflows/pull-request-validation.yml
  - source: targets/docs/developer/github-actions/pull-request-validation.md
    target: docs/developer/github-actions/pull-request-validation.md
