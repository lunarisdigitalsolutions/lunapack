id: prettier-config
version: 1.0.0
license: MIT
author: Lunaris Digital Solutions <info@lunaris.digital>
description: Configure Prettier with prettier-config-standard and YAML conventions.
tags: [prettier, formatting, node]
managedFiles:
  - source: targets/prettier.config.cjs
    target: prettier.config.cjs
  - source: fragments/package.json/prettier-config.json
    target: package.json
    strategy:
      type: merge
      method: json
hooks:
  postInstall:
    - type: instruction
      file: instructions/install.md
