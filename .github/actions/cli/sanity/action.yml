name: Run Luna CLI sanity check
description: Run the complete Luna CLI lifecycle sanity script against a native published executable.

inputs:
  published-directory:
    description: Directory containing the native Luna executable.
    required: true
  source-ref:
    description: Git ref used to select LunaPack sanity source packs.
    required: true

runs:
  using: composite
  steps:
    - name: Run CLI sanity check
      shell: pwsh
      env:
        GIT_CONFIG_GLOBAL: ${{ runner.temp }}/luna-sanity-gitconfig
        GIT_CONFIG_NOSYSTEM: '1'
        HOME: ${{ runner.temp }}/luna-sanity-home
        PUBLISHED_DIRECTORY: ${{ inputs.published-directory }}
        SANITY_SCRIPT: ${{ github.workspace }}/scripts/Test-CliSanity.ps1
        SOURCE_REF: ${{ inputs.source-ref }}
        TMPDIR: ${{ runner.temp }}/luna-sanity-tmp
        WORKSPACE: ${{ runner.temp }}/luna-sanity-check
        XDG_CACHE_HOME: ${{ runner.temp }}/luna-sanity-home/.cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/luna-sanity-home/.config
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path $env:HOME, $env:TMPDIR, $env:WORKSPACE | Out-Null

        $lunaExecutable = Join-Path $env:PUBLISHED_DIRECTORY 'luna.exe'
        if (-not (Test-Path -LiteralPath $lunaExecutable -PathType Leaf)) {
          $lunaExecutable = Join-Path $env:PUBLISHED_DIRECTORY 'luna'
        }
        if (-not (Test-Path -LiteralPath $lunaExecutable -PathType Leaf)) {
          throw "Published Luna executable not found in $env:PUBLISHED_DIRECTORY."
        }

        pwsh -NoLogo -NoProfile -NonInteractive -File $env:SANITY_SCRIPT `
          -LunaPath $lunaExecutable `
          -SourceRef $env:SOURCE_REF `
          -Workspace $env:WORKSPACE
