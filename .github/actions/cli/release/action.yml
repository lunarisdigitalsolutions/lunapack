name: Release Luna CLI
description: Select stable or preview Luna CLI release channels.

inputs:
  release-type:
    description: Release type. Stable publishes every channel; preview currently publishes NuGet only.
    required: false
    default: stable
  version:
    description: Existing v-prefixed stable tag or plain preview package version.
    required: true
  artifact-pattern:
    description: Pattern used to download CLI distribution artifacts.
    required: false
    default: cli-distribution-*
  nuget-artifact-pattern:
    description: Pattern used to download RID-specific NuGet packages.
    required: false
    default: cli-nuget-*
  run-id:
    description: Workflow run ID containing stable release artifacts.
    required: false
    default: ''
  changelog-path:
    description: Canonical CLI changelog path.
    required: false
    default: projects/cli/CHANGELOG.md
  nuget-user:
    description: NuGet username used for trusted publishing.
    required: true
  dry-run:
    description: Validate and stage without publishing.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Select release channels
      id: release
      shell: bash
      env:
        RELEASE_TYPE: ${{ inputs.release-type }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RELEASE_TYPE" in
          stable)
            if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
              echo "Stable release version is invalid: $VERSION" >&2
              exit 1
            fi
            channels='github,container,npm,nuget'
            ;;
          preview)
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]]; then
              echo "Preview release version is invalid: $VERSION" >&2
              exit 1
            fi
            channels='nuget'
            ;;
          *)
            echo "Unsupported release type: $RELEASE_TYPE" >&2
            exit 1
            ;;
        esac
        printf 'channels=%s\n' "$channels" >> "$GITHUB_OUTPUT"

    - name: Prepare stable release
      if: ${{ inputs.release-type == 'stable' }}
      uses: ./.github/actions/cli/release/prepare
      with:
        version: ${{ inputs.version }}
        artifact-pattern: ${{ inputs.artifact-pattern }}
        run-id: ${{ inputs.run-id || github.run_id }}
        changelog-path: ${{ inputs.changelog-path }}

    - name: Release selected channels
      uses: ./.github/actions/cli/release/channels
      with:
        channels: ${{ steps.release.outputs.channels }}
        release-type: ${{ inputs.release-type }}
        version: ${{ inputs.version }}
        nuget-artifact-pattern: ${{ inputs.nuget-artifact-pattern }}
        run-id: ${{ inputs.run-id }}
        changelog-path: ${{ inputs.changelog-path }}
        nuget-user: ${{ inputs.nuget-user }}
        dry-run: ${{ inputs.dry-run }}
