name: Build Developer Website
description: Check out, install, and build the Docusaurus developer website.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: projects/website/package-lock.json

    - name: Install website dependencies
      shell: bash
      working-directory: projects/website
      run: npm ci

    - name: Build website
      shell: bash
      working-directory: projects/website
      run: npm run build
