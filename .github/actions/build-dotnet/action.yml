name: Build .NET
description: Restore, build, test, and optionally publish a .NET project.

inputs:
  solution-path:
    description: Path to the solution to restore and build.
    required: true
  publish-project-path:
    description: Path to the project built and published when a runtime identifier is supplied.
    required: false
    default: ''
  runtime-identifier:
    description: Runtime identifier used when building and publishing a project.
    required: false
    default: ''
  build-configuration:
    description: Build configuration.
    required: false
    default: Release
  test-build-configuration:
    description: Build configuration used for instrumented test runs.
    required: false
    default: Debug
  test-project-paths:
    description: Optional newline-separated test project paths for separate reporting.
    required: false
    default: ''
  should-run-tests:
    description: Whether to run the solution's tests with coverage.
    required: false
    default: 'true'
  should-publish:
    description: Whether to publish the configured project.
    required: false
    default: 'false'
  additional-publish-arguments:
    description: Optional whitespace-delimited dotnet publish arguments, such as --self-contained true -p:PublishAot=true.
    required: false
    default: ''
  artifact-name:
    description: Prefix used when uploading test, coverage, or build artifacts.
    required: false
    default: dotnet-build
  artifact-output-path:
    description: Output directory for an optional published project.
    required: false
    default: ''
  artifact-retention-days:
    description: Retention period for uploaded artifacts.
    required: false
    default: '3'
  should-upload-build-artifact:
    description: Whether to upload the published project output.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore locked solution dependencies
      shell: bash
      run: dotnet restore "${{ inputs.solution-path }}" --locked-mode

    - name: Build solution
      shell: bash
      run: dotnet build "${{ inputs.solution-path }}" --configuration "${{ inputs.build-configuration }}" --no-restore

    - name: Publish runtime-specific project
      if: ${{ inputs.runtime-identifier != '' }}
      shell: pwsh
      env:
        ADDITIONAL_PUBLISH_ARGUMENTS: ${{ inputs.additional-publish-arguments }}
        BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
        PUBLISH_PROJECT_PATH: ${{ inputs.publish-project-path }}
        RUNTIME_IDENTIFIER: ${{ inputs.runtime-identifier }}
      run: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PROJECT_PATH)) {
          throw 'PUBLISH_PROJECT_PATH must be supplied when a runtime identifier is specified.'
        }

        $additionalArguments = @($env:ADDITIONAL_PUBLISH_ARGUMENTS -split '\s+' | Where-Object { $_ })
        $buildArguments = @(
          'publish'
          $env:PUBLISH_PROJECT_PATH
          '--configuration'
          $env:BUILD_CONFIGURATION
          '--runtime'
          $env:RUNTIME_IDENTIFIER
          '--no-restore'
        )

        dotnet @buildArguments @additionalArguments

    - name: Run tests
      id: tests
      if: ${{ inputs.should-run-tests == 'true' }}
      shell: pwsh
      env:
        SOLUTION_PATH: ${{ inputs.solution-path }}
        TEST_BUILD_CONFIGURATION: ${{ inputs.test-build-configuration }}
        TEST_PROJECT_PATHS: ${{ inputs.test-project-paths }}
      run: |
        $ErrorActionPreference = 'Stop'
        $projectPaths = @(
          $env:TEST_PROJECT_PATHS -split '\r?\n' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
        )
        $targets = if ($projectPaths.Count -eq 0) {
          @([PSCustomObject]@{ Option = '--solution'; Path = $env:SOLUTION_PATH; Name = 'solution' })
        }
        else {
          @(
            foreach ($projectPath in $projectPaths) {
              [PSCustomObject]@{
                Option = '--project'
                Path = $projectPath
                Name = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
              }
            }
          )
        }

        foreach ($target in $targets) {
          $resultsDirectory = Join-Path $env:RUNNER_TEMP "dotnet-test-results/$($target.Name)"
          $testArguments = @(
            'test'
            $target.Option
            $target.Path
            '--configuration'
            $env:TEST_BUILD_CONFIGURATION
            '--no-restore'
            '--results-directory'
            $resultsDirectory
            '--report-trx'
            '--report-trx-filename'
            "$($target.Name).trx"
            '--coverage'
            '--coverage-output'
            "$($target.Name).cobertura.xml"
            '--coverage-output-format'
            'cobertura'
            '--minimum-expected-tests'
            '1'
          )
          dotnet @testArguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Upload test report
      if: ${{ inputs.should-run-tests == 'true' && steps.tests.outcome == 'success' }}
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: Tests
        path: '${{ runner.temp }}/dotnet-test-results/**/*.trx'
        reporter: dotnet-trx
        path-replace-backslashes: true

    - name: Generate test coverage report
      if: ${{ inputs.should-run-tests == 'true' && steps.tests.outcome == 'success' }}
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
      with:
        reports: '${{ runner.temp }}/dotnet-test-results/**/*.cobertura.xml'
        targetdir: TestReports
        reporttypes: MarkdownSummaryGithub
        tag: '${{ github.run_number }}_${{ github.run_id }}'
        toolpath: reportgeneratortool

    - name: Publish test coverage report
      if: ${{ inputs.should-run-tests == 'true' && steps.tests.outcome == 'success' }}
      shell: bash
      run: cat TestReports/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish project
      if: ${{ inputs.should-publish == 'true' }}
      shell: pwsh
      env:
        ADDITIONAL_PUBLISH_ARGUMENTS: ${{ inputs.additional-publish-arguments }}
        PUBLISH_PROJECT_PATH: ${{ inputs.publish-project-path }}
        RUNTIME_IDENTIFIER: ${{ inputs.runtime-identifier }}
        ARTIFACT_OUTPUT_PATH: ${{ inputs.artifact-output-path }}
        BUILD_CONFIGURATION: ${{ inputs.build-configuration }}
      run: |
        $ErrorActionPreference = 'Stop'

        foreach ($inputName in @('PUBLISH_PROJECT_PATH', 'ARTIFACT_OUTPUT_PATH')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($inputName))) {
            throw "$inputName must be supplied when publication is enabled."
          }
        }

        $additionalArguments = @($env:ADDITIONAL_PUBLISH_ARGUMENTS -split '\s+' | Where-Object { $_ })
        $publishArguments = @(
          'publish'
          $env:PUBLISH_PROJECT_PATH
          '--configuration'
          $env:BUILD_CONFIGURATION
          '--no-build'
          '--no-restore'
          '--output'
          $env:ARTIFACT_OUTPUT_PATH
        )

        if (-not [string]::IsNullOrWhiteSpace($env:RUNTIME_IDENTIFIER)) {
          $publishArguments += @('--runtime', $env:RUNTIME_IDENTIFIER)
        }

        dotnet @publishArguments @additionalArguments

    - name: Publish artifact file list
      if: ${{ inputs.should-publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        {
          echo '<details>'
          echo '<summary><strong>Published files</strong></summary>'
          echo
          echo '```text'
          find "${{ inputs.artifact-output-path }}" -type f | sort
          echo '```'
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload published artifact
      if: ${{ inputs.should-upload-build-artifact == 'true' && success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-output-path }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
