name: 'PR: Title Validation'

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - edited
      - synchronize
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pull-request:
    name: Validate title and description
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Install Commitlint
        run: >-
          npm install --no-save --ignore-scripts --loglevel=error
          @commitlint/config-conventional@20.4.2 @commitlint/cli@20.4.2

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'Pull request title: %s\n' "$PR_TITLE"
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint
