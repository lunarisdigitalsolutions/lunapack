name: 'CLI: Release'

on:
  push:
    tags:
      - '**'
    branches:
      - main
    paths:
      - 'projects/cli/**'

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      release-type: ${{ steps.targets.outputs.release-type }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: Create target matrix
        id: targets
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?)$') {
              throw 'Release builds must run against a v<semantic-version> tag without build metadata.'
            }

            $buildVersion = $Matches['version']
            $releaseType = 'stable'
            $releaseVersion = $env:REF_NAME
          }
          else {
            $buildVersion = dotnet minver . --tag-prefix v --default-pre-release-identifiers preview --verbosity error
            if ($LASTEXITCODE -ne 0) {
              throw 'MinVer failed to resolve a preview version.'
            }
            if ($buildVersion -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$') {
              throw "MinVer did not produce a preview version: $buildVersion"
            }

            $releaseType = 'preview'
            $releaseVersion = $buildVersion
          }

          $selectedRuntimeIdentifiers = @(
            'win-x64',
            'linux-x64',
            'linux-arm64',
            'osx-x64',
            'osx-arm64'
          )

          $targets = @{
            'linux-x64' = [PSCustomObject]@{ runner = 'ubuntu-latest'; runtimeIdentifier = 'linux-x64' }
            'linux-arm64' = [PSCustomObject]@{ runner = 'ubuntu-24.04-arm'; runtimeIdentifier = 'linux-arm64' }
            'osx-x64' = [PSCustomObject]@{ runner = 'macos-15-intel'; runtimeIdentifier = 'osx-x64' }
            'osx-arm64' = [PSCustomObject]@{ runner = 'macos-15'; runtimeIdentifier = 'osx-arm64' }
            'win-x64' = [PSCustomObject]@{ runner = 'windows-latest'; runtimeIdentifier = 'win-x64' }
          }
          $selectedTargets = @(
            foreach ($runtimeIdentifier in $selectedRuntimeIdentifiers) {
              if (-not $targets.ContainsKey($runtimeIdentifier)) {
                throw "Unsupported runtime identifier: $runtimeIdentifier. Supported values: $($targets.Keys -join ', ')."
              }

              [PSCustomObject]@{
                runner = $targets[$runtimeIdentifier].runner
                runtimeIdentifier = $targets[$runtimeIdentifier].runtimeIdentifier
                buildVersion = $buildVersion
              }
            }
          )

          $matrix = ConvertTo-Json -InputObject ([object[]]$selectedTargets) -Compress
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "release-type=$releaseType" >> $env:GITHUB_OUTPUT
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

  build:
    name: ${{ matrix.runtimeIdentifier }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build Luna CLI
        uses: ./.github/actions/cli/build
        with:
          runtime-identifier: ${{ matrix.runtimeIdentifier }}
          version: ${{ matrix.buildVersion }}
          publish-artifacts: 'true'

  release:
    name: Publish ${{ needs.plan.outputs.release-type }} release
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release Luna CLI
        uses: ./.github/actions/cli/release
        with:
          release-type: ${{ needs.plan.outputs.release-type }}
          version: ${{ needs.plan.outputs.version }}
          run-id: ${{ github.run_id }}
          nuget-user: ${{ secrets.NUGET_USER }}
          dry-run: 'false'
