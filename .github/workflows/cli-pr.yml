name: 'PR: CLI'

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main
    paths:
      - 'projects/cli/**'
      - '.github/actions/build-dotnet/**'
      - '.github/actions/cli/**'
      - '.github/workflows/cli.yml'
      - '.github/workflows/cli-pr.yml'

permissions:
  contents: read

jobs:
  build-linux:
    name: ${{ matrix.runtimeIdentifier }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtimeIdentifier: linux-x64
          - runner: ubuntu-24.04-arm
            runtimeIdentifier: linux-arm64
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build Luna CLI
        uses: ./.github/actions/cli/build
        with:
          runtime-identifier: ${{ matrix.runtimeIdentifier }}
          publish-artifacts: 'false'

      - name: Run CLI sanity check
        uses: ./.github/actions/cli/sanity
        with:
          published-directory: ${{ github.workspace }}/projects/cli/src/Lunapack.Cli/bin/Release/net10.0/${{ matrix.runtimeIdentifier }}/publish
          source-ref: ${{ github.sha }}

  build-macos:
    name: ${{ matrix.runtimeIdentifier }}
    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'ci-macos') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            runtimeIdentifier: osx-x64
          - runner: macos-26
            runtimeIdentifier: osx-arm64
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build Luna CLI
        uses: ./.github/actions/cli/build
        with:
          runtime-identifier: ${{ matrix.runtimeIdentifier }}
          test-project-paths: |
            projects/cli/src/Lunapack.Cli.UnitTests/Lunapack.Cli.UnitTests.csproj
            projects/cli/src/Lunapack.Cli.IntegrationTests/Lunapack.Cli.IntegrationTests.csproj
            projects/cli/src/Lunapack.Cli.SecurityTests/Lunapack.Cli.SecurityTests.csproj
          publish-artifacts: 'false'

      - name: Run CLI sanity check
        uses: ./.github/actions/cli/sanity
        with:
          published-directory: ${{ github.workspace }}/projects/cli/src/Lunapack.Cli/bin/Release/net10.0/${{ matrix.runtimeIdentifier }}/publish
          source-ref: ${{ github.sha }}

  build-windows:
    name: win-x64
    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'ci-windows') }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build Luna CLI
        uses: ./.github/actions/cli/build
        with:
          runtime-identifier: win-x64
          test-project-paths: |
            projects/cli/src/Lunapack.Cli.UnitTests/Lunapack.Cli.UnitTests.csproj
            projects/cli/src/Lunapack.Cli.IntegrationTests/Lunapack.Cli.IntegrationTests.csproj
            projects/cli/src/Lunapack.Cli.SecurityTests/Lunapack.Cli.SecurityTests.csproj
          publish-artifacts: 'false'

      - name: Run CLI sanity check
        uses: ./.github/actions/cli/sanity
        with:
          published-directory: ${{ github.workspace }}/projects/cli/src/Lunapack.Cli/bin/Release/net10.0/win-x64/publish
          source-ref: ${{ github.sha }}
