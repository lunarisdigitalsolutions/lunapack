name: 'PR: CLI'

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main
    paths:
      - 'projects/cli/**'
      - '.github/actions/build-dotnet/**'
      - '.github/actions/cli/**'
      - '.github/workflows/cli.yml'
      - '.github/workflows/cli-pr.yml'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runtimeIdentifier }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtimeIdentifier: linux-x64
            testProjectPaths: ''
          - runner: macos-26-intel
            runtimeIdentifier: osx-x64
            testProjectPaths: projects/cli/src/Lunapack.Cli.UnitTests/Lunapack.Cli.UnitTests.csproj
          - runner: macos-26
            runtimeIdentifier: osx-arm64
            testProjectPaths: projects/cli/src/Lunapack.Cli.UnitTests/Lunapack.Cli.UnitTests.csproj
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build Luna CLI
        uses: ./.github/actions/cli/build
        with:
          runtime-identifier: ${{ matrix.runtimeIdentifier }}
          test-project-paths: ${{ matrix.testProjectPaths }}
          publish-artifacts: 'false'
