name: Bug report
description: Report reproducible incorrect behavior in LunaPack.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private security advisory link instead.
  - type: input
    id: version
    attributes:
      label: Luna version
      description: Run `luna --version` and provide the result.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub Release archive
        - npm
        - .NET tool
        - Docker
        - Source build
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and include sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repository-safe sequence of commands and files.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, .NET or Node version, and Git version when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private URLs, customer data, and personal information.
          required: true
